{% extends "base.html" %}

{% block title %}Página não encontrada{% endblock %}

{% block content %}
<div class="text-center py-5">
    <p class="display-1 fw-bold text-secondary mb-0">404</p>
    <h1 class="h3 mb-3">Página não encontrada</h1>
    <p class="text-muted">O endereço que você tentou abrir não existe ou foi removido.</p>
    <a href="{{ url_for('index') }}" class="btn btn-dark">Voltar ao início</a>
</div>
{% endblock %}
